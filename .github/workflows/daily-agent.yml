name: Daily AI Agent

# این بخش می‌گوید ربات چه زمانی اجرا شود
on:
  schedule:
    - cron: '0 8 * * *' # هر روز ساعت 8 صبح (به وقت جهانی)
  workflow_dispatch: # این خط اجازه می‌دهد خودمان دستی هم ربات را اجرا کنیم

# دادن دسترسی به ربات برای ذخیره فایل در سایت
permissions:
  contents: write

jobs:
  generate-article:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install openai

      - name: Run AI Agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python agent.py

      - name: Commit and push changes
        run: |
          git config --global user.name "AI Agent"
          git config --global user.email "agent@lean-construction.ir"
          git add articles/
          # اگر مقاله جدیدی بود، آن را ذخیره کن
          git diff --quiet && git diff --staged --quiet || (git commit -m "Add daily AI article" && git push)
