name: Daily AI Agent

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-article:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install google-generativeai

      - name: Run AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python agent.py

      - name: Commit and push changes
        run: |
          git config --global user.name "AI Agent"
          git config --global user.email "agent@lean-construction.ir"
          git add articles/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Add daily AI article (Gemini)" && git push)
